name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[onnx,train,web,dev]"
      - name: Ruff
        run: ruff check src datasets training tests web scripts
      - name: Mypy
        run: mypy src

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[onnx,train,web,dev]"
      # The fast suite covers every product invariant -- the decision rule,
      # eligibility, shot assembly, scheduling, the watchdog and calibration.
      # It must pass on every supported interpreter.
      - name: Unit tests
        run: pytest -q -m "not slow"
      # The end-to-end runs drive real video through the whole graph. They are
      # CPU-bound and slow, so they run once rather than across the matrix.
      - name: End-to-end tests
        if: matrix.python == '3.11'
        run: pytest -q -m slow
        timeout-minutes: 25

  invariants:
    name: Product invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[onnx,dev]"
      # Called out as its own job so that a failure here is unmistakable in the
      # checks list. These are the acceptance criteria: the exact 60% boundary,
      # the all-four morphology rule, once-only counting, and FIELD_OFF as the
      # fail-safe. A green build with these red would be worse than no build.
      - name: Decision rule and eligibility
        run: pytest -q tests/test_decision_rule.py tests/test_eligibility_rule.py
      - name: Shot assembly and counting
        run: pytest -q tests/test_shots.py
      - name: Scheduling, actuation and fail-safe
        run: pytest -q tests/test_scheduling_and_actuation.py
      - name: Calibration refusals
        run: pytest -q tests/test_calibration.py
      - name: Configurations are valid and coherent
        run: |
          for f in configs/*.yaml; do
            python -m sperm_sorting.cli show-config -c "$f" > /dev/null
            echo "ok: $f"
          done
      - name: Feasibility budget closes for the synthetic build
        run: python -m sperm_sorting.cli feasibility -c configs/synthetic.yaml || true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t sperm-sorting:ci .
      - name: Smoke-run the pipeline in the image
        run: docker run --rm sperm-sorting:ci run -c configs/synthetic.yaml -n 60
