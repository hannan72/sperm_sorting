[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sperm-sorting-ai"
version = "0.1.0"
description = "Real-time AI-guided sperm analysis and conditional magnetic sorting (research prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "sperm_sorting contributors" }]
keywords = ["microscopy", "computer-vision", "tracking", "casa", "real-time"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.8",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "typer>=0.9",
  "rich>=13.0",
  "pandas>=2.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "torchvision>=0.16"]
onnx = ["onnx>=1.15", "onnxruntime>=1.16"]
train = [
  "torch>=2.1",
  "torchvision>=0.16",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "tensorboard>=2.14",
  "tqdm>=4.65",
]
web = ["fastapi>=0.109", "uvicorn[standard]>=0.27", "python-multipart>=0.0.6"]
camera = ["pypylon>=3.0"]
gpio = ["gpiod>=2.1"]
serial = ["pyserial>=3.5"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "hypothesis>=6.90",
  "httpx2>=0.1",   # starlette.testclient requires httpx2, not httpx
  "ruff>=0.3",
  "mypy>=1.8",
]
all = [
  "sperm-sorting-ai[torch,onnx,train,web,dev]",
]

[project.scripts]
sperm-sorting = "sperm_sorting.cli:main"

[project.urls]
Repository = "https://github.com/hannan72/sperm_sorting"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["sperm_sorting*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
  "slow: takes more than a few seconds",
  "torch: requires PyTorch",
  "web: requires FastAPI and httpx",
  "hardware: requires physical camera or actuator hardware",
  "dataset: requires a downloaded public dataset",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "training", "datasets", "tests", "web", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # typer uses function calls in argument defaults by design
  "RUF012", # mutable class attrs are fine on pydantic models
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
files = ["src"]

[tool.coverage.run]
source = ["src/sperm_sorting"]
omit = ["*/basler.py", "*/gpio.py", "*/serial.py"]
